[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-network-scanner"
version = "0.1.0"
description = "A cautious network scanner for owned and authorized personal networks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Personal Network Scanner Contributors" }]
license = { text = "MIT" }
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
personal-network-scanner = "netscan.cli:main"

[tool.setuptools.packages.find]
include = ["netscan*"]

[tool.setuptools.package-data]
netscan = ["static/*"]
